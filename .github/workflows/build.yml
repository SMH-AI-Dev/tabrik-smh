name: Build all platforms
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Web-PWA
          path: shared/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Windows
          path: windows/dist/*.exe

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Linux
          path: windows/dist/*.AppImage

  android:
    # APK امضاشده Release با کلید smh (از Secrets) — قابل آپلود در بازار/مایکت + نصب مستقیم برای تست
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android
      - name: Fix Kotlin stdlib duplicates
        run: |
          python3 - <<'EOF'
          p = 'android/build.gradle'
          s = open(p, encoding='utf-8').read()
          fix = ("\nallprojects {\n    configurations.all {\n"
                 "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n"
                 "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n"
                 "    }\n}\n")
          if 'kotlin-stdlib-jdk8' not in s:
              s += fix
              open(p, 'w', encoding='utf-8').write(s)
              print('patched')
          else:
              print('already patched')
          EOF
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease
        working-directory: android
      - name: Sign release APK
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/smh.keystore
          BT=$(ls "$ANDROID_HOME/build-tools" | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-unsigned.apk android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "Unsigned: $UNSIGNED | build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -v -p 4 "$UNSIGNED" /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks /tmp/smh.keystore --ks-pass:env KEYSTORE_PASSWORD --key-pass:env KEY_PASSWORD --out Tabrik-SMH-Android.apk /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs Tabrik-SMH-Android.apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Android-Release
          path: Tabrik-SMH-Android.apk
