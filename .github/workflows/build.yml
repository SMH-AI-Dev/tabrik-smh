name: Build all platforms
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Web-PWA
          path: shared/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Windows
          path: windows/dist/*.exe

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Linux
          path: windows/dist/*.AppImage

  android:
    # APK امضاشده Release با کلید smh (از Secrets) — قابل آپلود در بازار/مایکت + نصب مستقیم برای تست
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android
      - name: Fix Kotlin stdlib duplicates
        run: |
          python3 - <<'EOF'
          p = 'android/build.gradle'
          s = open(p, encoding='utf-8').read()
          fix = ("\nallprojects {\n    configurations.all {\n"
                 "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n"
                 "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n"
                 "    }\n}\n")
          if 'kotlin-stdlib-jdk8' not in s:
              s += fix
              open(p, 'w', encoding='utf-8').write(s)
              print('patched')
          else:
              print('already patched')
          EOF
      - run: chmod +x android/gradlew
      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/smh.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Debug keystore integrity (no secrets printed)
        run: |
          echo "size: $(stat -c%s /tmp/smh.keystore) (expect 2706)"
          sha256sum /tmp/smh.keystore
          echo "storepass len: ${#KEYSTORE_PASSWORD} (expect 24)"
          echo "keypass len: ${#KEY_PASSWORD} (expect 24)"
          echo "alias: [$KEY_ALIAS]"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Inject release signing (Gradle)
        run: |
          grep -n -A8 'buildTypes' android/app/build.gradle | head -20
          python3 - <<'EOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = '''signingConfigs {
                  release {
                      storeFile file(System.getenv("SMH_KEYSTORE") ?: "/tmp/smh.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''
          s2, n = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', block + r'\1\n            signingConfig signingConfigs.release', s, count=1)
          assert n == 1, 'signing pattern not found'
          open(p, 'w', encoding='utf-8').write(s2)
          print('signing patched')
          EOF
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          SMH_KEYSTORE: /tmp/smh.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Verify + publish APK
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | tail -1)
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk Tabrik-SMH-Android.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs Tabrik-SMH-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tabrik-SMH-Android-Release
          path: Tabrik-SMH-Android.apk
